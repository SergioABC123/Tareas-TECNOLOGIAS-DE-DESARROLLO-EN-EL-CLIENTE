<section>
  <h1>Catálogo de películas</h1>
  <p>Explora la colección y guarda tus películas favoritas.</p>

  <form
    class="filters"
    [formGroup]="filterForm"
    aria-label="Filtros de películas"
  >
    <label>
      Título
      <input
        type="search"
        formControlName="title"
        placeholder="Ej. Interstellar"
      />
    </label>

    <label>
      Director
      <input
        type="search"
        formControlName="director"
        placeholder="Ej. Christopher Nolan"
      />
    </label>

    <label>
      Productor
      <input
        type="search"
        formControlName="producer"
        placeholder="Ej. Emma Thomas"
      />
    </label>

    <label>
      Género
      <select formControlName="genre">
        <option value="">Todos los géneros</option>

        @for (genre of genres; track genre) {
          <option [value]="genre">{{ genre }}</option>
        }
      </select>
    </label>

    <label>
      Año
      <select formControlName="year">
        <option value="">Todos los años</option>

        @for (year of years; track year) {
          <option [value]="year">{{ year }}</option>
        }
      </select>
    </label>

    <button type="button" (click)="clearFilters()">
      Limpiar filtros
    </button>
  </form>

  <p role="status">
    Películas encontradas: {{ filteredMovies().length }}
  </p>

  <div class="movie-grid">
    @for (movie of filteredMovies(); track movie.id) {
      <app-movie-card
        [movie]="movie"
        [isFavorite]="favoritesService.isFavorite(movie.id)"
        (favoriteChange)="favoritesService.toggleFavorite($event)"
      />
    } @empty {
      <p>No se encontraron películas con esos filtros.</p>
    }
  </div>
</section>
